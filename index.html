<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RWG – connection test</title>
<style>
:root{--ink:#14161A;--paper:#FAFAF7;--line:#D9DCE1;--red:#E5484D;--green:#2EA44F;--card:#fff}
@media (prefers-color-scheme:dark){:root{--ink:#F2F3F5;--paper:#101216;--line:#2A2E36;--card:#181B21}}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:560px;margin:0 auto;padding:20px 16px 60px}
h1{font-size:22px;margin:0 0 4px}
.sub{opacity:.7;margin:0 0 20px;font-size:14px}
button{font:inherit;cursor:pointer;border:0;border-radius:10px;padding:10px 14px}
.main{background:var(--ink);color:var(--paper);font-weight:700;width:100%}
textarea{width:100%;min-height:84px;font:inherit;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);margin-bottom:8px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:16px}
.row button{background:none;border:1px solid var(--line);color:var(--ink);padding:6px 10px;font-size:13px}
.post{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.who{font-weight:700;font-size:14px}
.body{margin:6px 0 12px;white-space:pre-wrap;overflow-wrap:anywhere}
.bar{display:flex;height:8px;border-radius:4px;overflow:hidden;background:var(--line);margin-bottom:8px}
.bar i{display:block}
.v{display:flex;gap:6px}
.v button{flex:1;border:2px solid transparent;font-weight:700;font-size:14px;color:#fff}
.v .r{background:var(--red)}.v .w{background:#fff;color:#14161A;border-color:var(--line)}.v .g{background:var(--green)}
.v .on{outline:3px solid var(--ink);outline-offset:1px}
.cnt{font-size:12px;opacity:.7;margin-top:6px;text-align:center}
.msg{padding:10px 12px;border-radius:10px;background:var(--card);border:1px solid var(--line);font-size:14px;margin-bottom:12px}
.err{border-color:var(--red);color:var(--red)}
.cms{margin-top:10px}
.cm{border-inline-start:4px solid var(--line);padding:2px 8px;margin:6px 0;font-size:14px;overflow-wrap:anywhere}
.cm.r{border-color:var(--red)}.cm.g{border-color:var(--green)}.cm.w{border-color:#9AA0A6}
.cmrow{display:flex;gap:6px;margin-top:8px}
.cmrow input{flex:1;min-width:0;font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink)}
.cmrow button{background:var(--ink);color:var(--paper);font-weight:700;padding:8px 12px}
</style>
</head>
<body>
<main>
  <h1>RWG connection test</h1>
  <p class="sub">Sign in, write a post, and vote. If it works, the server is ready.</p>
  <div id="msg"></div>
  <div id="app"></div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
var SB_URL='https://lstjzxxsosgvxhjthzbm.supabase.co';
var SB_KEY='sb_publishable_ImWnPCq9Cy8scBdU_kPCLw_mygJWmTV';
var sb=supabase.createClient(SB_URL,SB_KEY);
var app=document.getElementById('app'),msg=document.getElementById('msg'),me=null;

function say(t,bad){msg.innerHTML='';if(!t)return;var d=document.createElement('div');d.className='msg'+(bad?' err':'');d.textContent=t;msg.appendChild(d)}
function el(tag,cls,text){var e=document.createElement(tag);if(cls)e.className=cls;if(text!=null)e.textContent=text;return e}

async function login(){
  var r=await sb.auth.signInWithOAuth({provider:'github',options:{redirectTo:location.origin+location.pathname}});
  if(r.error)say('Sign-in failed: '+r.error.message,true);
}
async function logout(){await sb.auth.signOut();me=null;draw()}

async function send(){
  var t=document.getElementById('t'),text=t.value.trim();
  if(!text){say('Write something first.',true);return}
  var r=await sb.from('posts').insert({author_id:me.id,body:text});
  if(r.error){say('Could not post: '+r.error.message,true);return}
  t.value='';say('Posted.');feed();
}
async function vote(pid,val){
  var r=await sb.from('votes').upsert({post_id:pid,user_id:me.id,value:val},{onConflict:'post_id,user_id'});
  if(r.error){say('Could not vote: '+r.error.message,true);return}
  feed();
}
async function feed(){
  var box=document.getElementById('feed');if(!box)return;
  var p=await sb.from('posts').select('id,body,created_at,profiles!posts_author_id_fkey(username)').order('created_at',{ascending:false}).limit(30);
  if(p.error){say('Could not load posts: '+p.error.message,true);return}
  var ids=p.data.map(function(x){return x.id});
  var v=await sb.from('votes').select('post_id,user_id,value');
  var votes=v.data||[];
  var cm=ids.length?await sb.from('comments').select('id,post_id,body,vote_at_time,created_at,profiles!comments_author_id_fkey(username)').in('post_id',ids).order('created_at',{ascending:true}):{data:[]};
  if(cm.error)say('Could not load comments: '+cm.error.message,true);
  var comments=cm.data||[];
  var sv=await sb.from('saves').select('post_id');
  var saved={};(sv.data||[]).forEach(function(x){saved[x.post_id]=1});
  box.innerHTML='';
  if(!p.data.length){box.appendChild(el('div','msg','No posts yet. Write the first one above.'));return}
  p.data.forEach(function(post){
    var mine=null,c={'-1':0,'0':0,'1':0};
    votes.forEach(function(x){if(x.post_id===post.id){c[x.value]++;if(x.user_id===me.id)mine=x.value}});
    var n=c['-1']+c['0']+c['1'];
    var card=el('div','post');
    var head=el('div','row');head.style.marginBottom='0';
    head.appendChild(el('span','who','@'+(post.profiles?post.profiles.username:'unknown')));
    var sb2=el('button',null,saved[post.id]?'Saved':'Save');sb2.onclick=function(){toggleSave(post.id,!!saved[post.id])};head.appendChild(sb2);
    card.appendChild(head);
    card.appendChild(el('div','body',post.body||''));
    var bar=el('div','bar');
    [['-1','var(--red)'],['0','#fff'],['1','var(--green)']].forEach(function(s){var i=el('i');i.style.width=(n?c[s[0]]/n*100:0)+'%';i.style.background=s[1];bar.appendChild(i)});
    card.appendChild(bar);
    var row=el('div','v');
    [['r','Disagree',-1],['w','Neutral',0],['g','Agree',1]].forEach(function(b){
      var btn=el('button',b[0]+(mine===b[2]?' on':''),b[1]);
      btn.onclick=function(){vote(post.id,b[2])};row.appendChild(btn);
    });
    card.appendChild(row);
    card.appendChild(el('div','cnt',c['-1']+' disagree · '+c['0']+' neutral · '+c['1']+' agree'));
    var list=el('div','cms');
    comments.filter(function(x){return x.post_id===post.id}).forEach(function(x){
      var k=x.vote_at_time===-1?'r':x.vote_at_time===0?'w':x.vote_at_time===1?'g':'';
      var d=el('div','cm '+k);
      d.appendChild(el('b',null,'@'+(x.profiles?x.profiles.username:'unknown')+' '));
      d.appendChild(document.createTextNode(x.body));
      list.appendChild(d);
    });
    card.appendChild(list);
    var cr=el('div','cmrow');
    var inp=el('input');inp.placeholder=mine===null?'Add a comment (vote first to give it a color)':'Add a comment';
    var sendBtn=el('button',null,'Comment');
    sendBtn.onclick=function(){addComment(post.id,inp.value,mine)};
    cr.appendChild(inp);cr.appendChild(sendBtn);card.appendChild(cr);
    box.appendChild(card);
  });
}
async function addComment(pid,text,mine){
  text=(text||'').trim();
  if(!text){say('Write a comment first.',true);return}
  var r=await sb.from('comments').insert({post_id:pid,author_id:me.id,body:text,vote_at_time:mine});
  if(r.error){say('Could not comment: '+r.error.message,true);return}
  say('');feed();
}
async function toggleSave(pid,isSaved){
  var r=isSaved?await sb.from('saves').delete().eq('user_id',me.id).eq('post_id',pid):await sb.from('saves').insert({user_id:me.id,post_id:pid});
  if(r.error){say('Could not save: '+r.error.message,true);return}
  feed();
}
var drawId=0;
async function draw(){
  var id=++drawId;
  if(!me){app.innerHTML='';var b=el('button','main','Sign in with GitHub');b.onclick=login;app.appendChild(b);return}
  var pr=await sb.from('profiles').select('username').eq('id',me.id).maybeSingle();
  if(id!==drawId)return;
  app.innerHTML='';
  var top=el('div','row');
  top.appendChild(el('span','who','Signed in as @'+(pr.data?pr.data.username:'(no profile yet)')));
  var o=el('button',null,'Sign out');o.onclick=logout;top.appendChild(o);
  app.appendChild(top);
  var t=el('textarea');t.id='t';t.placeholder='Write a post';app.appendChild(t);
  var s=el('button','main','Post');s.onclick=send;s.style.marginBottom='20px';app.appendChild(s);
  var f=el('div');f.id='feed';app.appendChild(f);
  feed();
}
var lastUid='init';
function setUser(session){var u=session?session.user:null,id=u?u.id:null;if(id===lastUid)return;lastUid=id;me=u;draw()}
sb.auth.onAuthStateChange(function(ev,session){setUser(session)});
sb.auth.getSession().then(function(r){setUser(r.data.session)});
</script>
</body>
</html>
