<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RWG</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;800&family=Nunito:wght@400;700;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#1B1B2F;--mute:#6C6C85;--line:#E6E3F2;--r:#EF4B52;--g:#25B358;--card:rgba(255,255,255,.88);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:#FBF9FF;color:var(--ink);font-family:'Nunito','Vazirmatn',system-ui,sans-serif;font-size:15px}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.bg{position:fixed;inset:0;overflow:hidden;z-index:0;pointer-events:none}
.bg i{position:absolute;width:70vmax;height:70vmax;border-radius:50%;filter:blur(70px);opacity:.55;animation:fl 22s ease-in-out infinite alternate}
.bg i:nth-child(1){background:#B79CFF;top:-25%;left:-20%}
.bg i:nth-child(2){background:#7CC4FF;top:30%;right:-30%;animation-delay:-7s}
.bg i:nth-child(3){background:#8BE6A8;bottom:-30%;left:-10%;animation-delay:-12s}
.bg i:nth-child(4){background:#FFC58A;top:10%;left:30%;width:40vmax;height:40vmax;animation-delay:-3s}
@keyframes fl{to{transform:translate(12vmax,8vmax) scale(1.2)}}
.app{max-width:480px;height:100%;margin:auto;display:flex;flex-direction:column;position:relative;overflow:hidden;z-index:1}
header{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--card);backdrop-filter:blur(10px)}
.logo{width:28px;height:28px;border-radius:8px;background:linear-gradient(#8E5BD8,#3E8BE8,#2FA84F,#F2C94C,#F2994A,#E24B4A);display:flex;flex-direction:column;justify-content:center;gap:2px;padding:0 4px}
.logo i{height:5px;border-radius:1px;border:.5px solid #222}
header b{font-weight:800;font-size:19px}
.screens{flex:1;position:relative;overflow:hidden}
.screen{position:absolute;inset:0;overflow-y:auto;padding-bottom:12px}
.screen[hidden]{display:none}
nav{display:flex;background:var(--card);backdrop-filter:blur(10px);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;padding:10px 0 8px;color:var(--mute);font-size:12px;display:flex;flex-direction:column;align-items:center;gap:2px}
nav button span{font-size:20px;line-height:1}
nav button.on{color:var(--ink);font-weight:800}
.stories{display:flex;gap:12px;padding:12px 14px;overflow-x:auto;background:var(--card);margin-bottom:8px}
.st{flex:none;width:64px;text-align:center;font-size:11px}
.ring{width:62px;height:62px;border-radius:50%;padding:3px;background:conic-gradient(#EB9637 0deg,#25B358 60deg,#25B358 120deg,#fff 180deg,#EF4B52 240deg,#EF4B52 300deg,#EB9637 360deg);margin-bottom:4px;box-shadow:0 0 0 1px rgba(0,0,0,.08)}
.ring.me{background:var(--line)}
.ring div{width:100%;height:100%;border-radius:50%;border:2px solid #fff;display:grid;place-items:center;color:#fff;font-weight:800;font-size:18px}
.post{background:var(--card);backdrop-filter:blur(8px);margin-bottom:10px;border-radius:16px;overflow:hidden;margin-inline:8px;box-shadow:0 4px 18px rgba(80,60,160,.12)}
.who{display:flex;align-items:center;gap:8px;padding:10px 12px}
.av{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:800}
.media{height:260px;position:relative;display:flex;align-items:flex-end;padding:14px;color:#fff;font-weight:700;line-height:1.6;font-size:16px}
.media p{text-shadow:0 1px 8px rgba(0,0,0,.55);max-width:86%}
.mini{position:absolute;left:10px;bottom:10px;width:72px;height:8px;border-radius:4px;display:flex;overflow:hidden;opacity:.9;border:1px solid rgba(0,0,0,.3)}
.mini i{display:block;height:100%}
.hit{position:absolute;left:0;bottom:0;width:90px;height:34px}
.pop{position:absolute;left:10px;bottom:28px;background:rgba(0,0,0,.78);color:#fff;font-size:12px;padding:6px 10px;border-radius:8px;line-height:1.7;font-weight:600}
.strip{display:flex;direction:ltr;padding:2px 10px 0}
.strip button{flex:1;height:40px;display:flex;align-items:center;padding:0 2px}
.strip span{display:block;width:100%;height:9px;border-radius:5px}
.strip.has span{opacity:.3}
.strip.has .sel span{opacity:1;height:15px;animation:pop .35s}
@keyframes pop{40%{transform:scaleY(1.7) scaleX(1.03)}}
.sr span{background:var(--r)}.sw span{background:#fff;box-shadow:inset 0 0 0 1px #cfcbe0}.sg span{background:var(--g)}
.labels{display:flex;direction:ltr;padding:0 12px;font-size:12px;color:var(--mute);font-weight:700}
.labels div{flex:1;text-align:center}
.acts{display:flex;gap:18px;padding:8px 14px 12px;color:var(--mute);font-weight:700}
.vb{display:inline-block;width:15px;height:15px;position:relative;vertical-align:-2px;margin-inline-start:4px;filter:drop-shadow(0 0 .6px rgba(0,0,0,.5))}
.vb::before{content:"";position:absolute;inset:0;border-radius:50%;background:conic-gradient(#EB9637 0deg,#2FA84F 60deg,#2FA84F 120deg,#fff 180deg,#E24B4A 240deg,#E24B4A 300deg,#EB9637 360deg);-webkit-mask:radial-gradient(circle,transparent 44%,#000 48%);mask:radial-gradient(circle,transparent 44%,#000 48%)}
.vb svg{position:absolute;inset:0;width:100%;height:100%;fill:none;stroke:var(--ink);stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round}
.sheet-bg{position:absolute;inset:0;background:rgba(20,10,50,.45);z-index:5;display:flex;align-items:flex-end}
.sheet-bg[hidden]{display:none}
.sheet{background:#fff;width:100%;max-height:78%;border-radius:20px 20px 0 0;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom,0px)}
.sheet h3{padding:14px;font-size:16px;display:flex;justify-content:space-between;border-bottom:1px solid var(--line)}
.clist{overflow-y:auto;padding:6px 14px;flex:1;min-height:110px}
.cm{padding:9px 10px;margin:8px 0;border-inline-start:4px solid var(--mute);background:#F6F4FC;border-radius:8px;line-height:1.6}
.cm small{color:var(--mute);display:block;font-weight:700}
.cm.r{border-color:var(--r)}.cm.g{border-color:var(--g)}
.cin{display:flex;gap:8px;padding:10px 12px;align-items:center;border-top:1px solid var(--line)}
.cd{width:14px;height:14px;border-radius:50%;flex:none;border:1px solid #cfcbe0}
.cin input,.chatin input{flex:1;min-width:0;padding:10px 14px;border-radius:22px;border:1px solid var(--line);background:#F6F4FC;color:var(--ink);font:inherit}
.send{padding:9px 16px;border-radius:20px;background:var(--ink);color:#fff;font-weight:800}
.note{padding:10px 14px;color:var(--mute);font-size:13px;text-align:center}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:3px;padding:3px}
.tile{aspect-ratio:1;position:relative;display:flex;align-items:flex-end;padding:6px;color:#fff;font-size:11px;text-align:start;line-height:1.4;font-weight:700;border-radius:8px}
.tile .mini{left:6px;bottom:auto;top:6px;width:42px;height:6px}
.row{display:flex;gap:12px;align-items:center;padding:12px 14px;background:var(--card);margin:6px 8px;border-radius:14px;width:calc(100% - 16px);text-align:start}
.row .meta{flex:1}.row small{color:var(--mute);display:block}
.chat{position:absolute;inset:0;background:#FBF9FF;z-index:4;display:flex;flex-direction:column}
.chat[hidden]{display:none}
.chat .top{display:flex;gap:10px;align-items:center;padding:12px 14px;background:#fff;font-weight:800}
.msgs{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:6px}
.m{max-width:78%;padding:8px 12px;border-radius:16px;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.08);line-height:1.6}
.m.me{align-self:flex-end;background:var(--ink);color:#fff}
.chatin{display:flex;gap:8px;padding:10px 12px;background:#fff}
.prof{background:var(--card);margin:8px;border-radius:16px;padding:20px 14px;text-align:center}
.prof .av{width:78px;height:78px;font-size:28px;margin:0 auto 10px}
.stats{display:flex;justify-content:center;gap:22px;margin:12px 0;color:var(--mute)}
.stats b{display:block;color:var(--ink);font-size:17px}
.vbar{height:9px;border-radius:5px;display:flex;overflow:hidden;max-width:220px;margin:8px auto 4px;border:1px solid var(--line)}
.tog,.sel-row{display:flex;justify-content:space-between;align-items:center;padding:13px 14px;background:var(--card);margin:6px 8px;border-radius:14px;width:calc(100% - 16px);text-align:start}
.tog i{width:40px;height:23px;border-radius:12px;background:#d5d1e6;position:relative;transition:background .15s;flex:none}
.tog i::after{content:"";position:absolute;top:2px;inset-inline-start:2px;width:19px;height:19px;border-radius:50%;background:#fff;transition:inset-inline-start .15s}
.tog.on i{background:var(--g)}.tog.on i::after{inset-inline-start:19px}
select{font:inherit;padding:6px 10px;border-radius:10px;border:1px solid var(--line);background:#fff;color:var(--ink)}
.story{position:absolute;inset:0;z-index:6;display:flex;flex-direction:column;justify-content:space-between;color:#fff}
.story[hidden]{display:none}
.story .bar{height:3px;background:rgba(255,255,255,.35);margin:10px 12px;border-radius:2px;overflow:hidden}
.story .bar i{display:block;height:100%;width:0;background:#fff;animation:fill 5s linear forwards}
@keyframes fill{to{width:100%}}
.story h2{padding:0 24px;font-size:24px;line-height:1.5;text-shadow:0 2px 10px rgba(0,0,0,.4)}
.tabs{display:flex;gap:8px;margin:8px 0}.tabs button{flex:1;padding:8px;border-radius:12px;background:#F6F4FC;font-weight:800}.tabs .on{background:var(--ink);color:#fff}
.pick{display:grid;place-items:center;min-height:160px;border:2px dashed var(--line);border-radius:14px;overflow:hidden;margin:8px 0;cursor:pointer;color:var(--mute);font-weight:700}.pick img,.pick video{width:100%;max-height:240px;object-fit:cover}
textarea{width:100%;padding:10px 14px;border-radius:14px;border:1px solid var(--line);background:#F6F4FC;color:var(--ink);font:inherit;resize:none}
#toast{position:absolute;bottom:80px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:8px 16px;border-radius:20px;z-index:9;font-weight:700;max-width:90%;word-break:break-all}#toast[hidden]{display:none}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.vh{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden}
.lay{position:absolute;inset:0;z-index:7;background:#FBF9FF;display:flex;flex-direction:column}.lay[hidden]{display:none}
.top{display:flex;gap:10px;align-items:center;padding:12px 14px;background:#fff;font-weight:800}
.scr{flex:1;overflow-y:auto}
.inp{width:100%;padding:10px 14px;border-radius:14px;border:1px solid var(--line);background:#fff;color:var(--ink);font:inherit}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:9px 14px;border-radius:20px;background:#fff;font-weight:800;cursor:pointer;position:relative;border:1px solid var(--line);color:var(--ink)}
.media,.cv,.pgm,.story{container-type:inline-size}
.mb{position:absolute;inset:0}.mb video{width:100%;height:100%;object-fit:cover}
.media p{position:relative}
.ovt{position:absolute;font-weight:800;text-shadow:0 1px 6px rgba(0,0,0,.5);white-space:pre;touch-action:none}
.ovt.sel,.vst.sel{outline:2px dashed #fff}
.vst{position:absolute;display:flex;width:34cqw;height:3.4cqw;min-height:10px;border-radius:99px;overflow:hidden;border:2px solid #fff;touch-action:none}.vst i{flex:1}
.pgw{display:block;overflow-y:scroll;scroll-snap-type:y mandatory;background:#000;z-index:4}
.pgi{height:100%;position:relative;scroll-snap-align:start;scroll-snap-stop:always;color:#fff}
.pgm{position:absolute;inset:0}.pgi .mb{background-size:contain!important;background-repeat:no-repeat!important}.pgi .mb video{object-fit:contain}
.pgb{position:absolute;left:0;right:0;bottom:0;padding:40px 14px 10px;background:linear-gradient(transparent,rgba(0,0,0,.75))}
.pgb p{margin:8px 0;font-weight:700}.pgb .labels{color:#ddd}
.pgx{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));inset-inline-end:12px;z-index:3;color:#fff;font-size:22px;text-shadow:0 1px 6px #000}
.edtop{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 12px;color:#fff}
.edtop button:not(.send){color:#fff;font-size:20px}
.edmain{flex:1;display:grid;place-items:center;overflow:hidden;padding:4px}
.cv{position:relative;height:100%;max-width:100%;overflow:hidden;border-radius:12px;background:#222}
.ph{position:absolute;inset:0;display:grid;place-items:center;color:#fff;font-weight:700;text-align:center;padding:20px}
.edtools{background:#1b1b24;padding:8px 10px;display:flex;flex-direction:column;gap:8px;color:#fff}
.edtools .row2{display:flex;gap:8px;overflow-x:auto;align-items:center}
.edtools button,.edtools .btn{flex:none;background:#2c2c3a;color:#fff;border:0;padding:8px 12px;border-radius:16px;font-weight:700}
.edtools input.inp,.edtools textarea{background:#2c2c3a;color:#fff;border-color:#3a3a4c}
.cdot{width:24px;height:24px;border-radius:50%;border:2px solid #fff;flex:none;padding:0!important}
.sysm{align-self:center;font-size:12px;color:var(--mute)}
.swc{width:30px;height:30px;border-radius:50%;border:2px solid var(--line);margin-inline-start:6px}
.seg button{padding:4px 12px;border-radius:12px;font-weight:800}.seg .on{background:var(--ink);color:#fff}
</style>
</head>

['retired','Retired, proud grandparent',['Hamid','Rosa','Henrik','Nasrin','Chen'],['Pensions should rise with the real cost of living, every year.','Young people spend too much time on screens. We had more fun outside.','Free public transport for seniors is a basic right.','Retirement at 60 should stay possible for hard physical jobs.','Grandparents are the best free childcare and we never say thanks.']],
['dev','Software engineer',['Ravi','Anna','Omar','Hana','Tomas'],['Remote work is here to stay, and offices should adapt.','Open-source maintainers deserve real funding.','Apps should truly delete your data when you delete your account.','Meetings that could have been an email are a tax on talent.','Everyone should learn basic coding, like basic maths.']],
['shop','Corner shop owner',['Mehdi','Ayse','Pedro','Li','Grace'],['Online giants should pay the same taxes as small shops.','Sunday opening hours: let shops decide for themselves.','Cash must stay accepted everywhere.','Main street rents are killing local shops.','Loyal customers are worth more than any ad campaign.']],
['sport','Amateur athlete & coach',['Diego','Layla','Kenji','Nadia','Femi'],['School sports deserve as much budget as exam prep.','Equal prize money for women’s and men’s tournaments.','Sleep is the most underrated training tool.','Should sports stars be role models, or just athletes?','Football is better with fewer VAR stoppages.']],
['art','Painter and illustrator',['Maryam','Pablo','Aiko','Ivan','Zara'],['Art should be a regular school subject, not an extra.','AI-generated images should be clearly labeled.','Artists deserve paid commissions, not “exposure”.','Street art makes a city better. Let walls be painted.','Public museums should be free at least one day a week.']],
['mech','Car mechanic',['Behrouz','Ali','Marco','Sven','Tariq'],['Cars should be repairable. Right to repair for everyone.','Electric cars are great, but repair costs scare people.','Teaching basic car care in school would save families money.','Cheap parts are never cheaper in the long run.','Old cars are not automatically the pollution villain. Maintenance matters.']],
['doc','Family doctor',['Shirin','Manuel','Aisha','Peter','Yara'],['Antibiotics are not for colds. Please stop asking.','Mental health care should be covered like any other care.','Sugar taxes work. The data is clear.','Doctors need at least 15 minutes per patient.','Vaccines remain one of humanity’s best inventions.']],
['home','Full-time parent',['Parisa','Lucia','Sana','Karin','Bita'],['Unpaid housework is real work and should count toward pensions.','Schools should start later so families can breathe in the morning.','Grocery prices have outrun salaries.','Flexible jobs would let parents work and be present.','Sharing chores equally is not a favor, it is fair.']],
['access','Accessibility advocate',['Sam','Noor','Kian','Maya','Luca'],['Every public building must have step-free access. No exceptions.','Say “accessible by design”, not “special accommodation”.','Captions on all videos help far more people than you think.','Employers: interview the skills, not the wheelchair.','Café tables blocking sidewalks are a daily barrier for us.']],
['news','Local reporter',['Nika','Hassan','Clara','Ken','Dina'],['Local news is dying and communities pay the price.','Always check the source before you share.','Headlines should never promise what the article does not deliver.','Paywalls or ads: which is the lesser evil for news?','Press freedom is not a luxury.']],
['chef','Restaurant chef',['Giulia','Farid','Min','Pierre','Salma'],['Restaurant food waste can be cut in half with smarter menus.','Street food is serious cooking and deserves respect.','Service should be included in the price and shared fairly with the kitchen.','Cooking at home three times a week changes your health.','Fusion food: brilliant or a mess?']],
['build','Construction worker',['Yusuf','Andrei','Tomasz','Joel','Armin'],['Safety gear on every site. No excuses, no shortcuts.','Skilled trades deserve the same respect as office jobs.','During heat waves, construction should pause at midday by law.','Affordable housing needs faster permits, not more talk.','Apprenticeships beat debt-heavy degrees for many people.']],
['biz','Small business founder',['Neda','Felix','Aarav','Carmen','Jin'],['Starting a business should take one day and one form.','Late payments from big companies kill small ones.','A four-person team beats a forty-person committee.','Failing once is the cheapest education there is.','Local suppliers first. It builds a stronger economy.']],
['jobs','Looking for work',['Sepideh','Marta','Bilal','Emma','Raj'],['Entry-level jobs asking for 5 years of experience must stop.','Employers should answer every application, even with a no.','Salary ranges should be listed in every job post.','Retraining at 40 is possible and needs more support.','A gap in a CV is life, not a red flag.']],
['newbie','Newcomer & volunteer',['Rahim','Oksana','Wei','Amara','Davit'],['Language classes for newcomers should be free and widespread.','Recognize foreign diplomas faster. Talent is going to waste.','A neighbor who says hello makes the biggest difference.','Cultural festivals bring cities closer. Attend one this month.','Integration works both ways, and takes time.']]];

function shrink(url){return new Promise(function(ok,no){var im=new Image();im.onload=function(){var w=im.naturalWidth,h=im.naturalHeight,k=Math.min(1,1280/Math.max(w,h)),c=document.createElement('canvas');c.width=Math.round(w*k);c.height=Math.round(h*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);c.toBlob(function(b){b?ok(b):no(new Error('compress'))},'image/jpeg',.82)};im.onerror=function(){no(new Error('image'))};im.src=url})}
var _pub=pub;pub=function(){
 var top=P[0],mode=(typeof D!=='undefined'&&D)?D.mode:'';
 _pub();
 var np=P[0];
 if(!SBU||mode==='story'||!np||np===top||np.u!==ME.u||np.promo)return;
 var body=(np.t||'').trim().slice(0,2000);
 if(np.vid){toast(X('Videos will be saved to the server in a later step.','ویدیوها در قدم بعدی روی سرور ذخیره می‌شوند.'));if(!body)return}
 var hasImg=!!np.img&&!np.vid;
 if(!body&&!hasImg)return;
 function save(url){
  var row={author_id:SBU.id,body:body};
  if(url)row.media_url=url,row.media_meta={fl:np.fl||'',ov:np.ov||[],ar:np.ar||null};
  return RSB.from('posts').insert(row).select('id').single().then(function(r){
   if(r.error){np.unsaved=1;toast(X('Could not save to the server: ','ذخیره روی سرور نشد: ')+r.error.message);return}
   np.sid=r.data.id;np.real=1;if(url)np.murl=url;
   toast(X('Saved to the server','روی سرور ذخیره شد'))})}
 if(!hasImg){save(null);return}
 toast(X('Uploading photo…','در حال آپلود عکس…'));
 shrink(np.img).then(function(blob){
  var path=SBU.id+'/'+Date.now()+'.jpg';
  return RSB.storage.from('post-media').upload(path,blob,{contentType:'image/jpeg'}).then(function(r){
   if(r.error)throw r.error;
   return save(RSB.storage.from('post-media').getPublicUrl(path).data.publicUrl)})
 }).catch(function(e){np.unsaved=1;toast(X('Photo upload failed: ','آپلود عکس نشد: ')+(e.message||e))})};
})();
</script>

<script>

 if(b&&!document.querySelector('button[onclick="rwgTips()"]'))b.insertAdjacentHTML('afterend','<button class="tog" onclick="rwgTips()"><span>'+tx('Show tips again','نمایش دوبارهٔ راهنما')+'</span><span>›</span></button>')};
